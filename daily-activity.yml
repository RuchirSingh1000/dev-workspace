name: Daily Workspace Update

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  workspace-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name "RuchirSingh1000"
          git config user.email "ruchirsingh1000@gmail.com"

      - name: Append workspace log entries
        shell: bash
        run: |
          set -euo pipefail
          count=$(( RANDOM % 12 + 2 ))
          day="$(date -u +%F)"
          mkdir -p logs

          for ((i=1; i<=count; i++)); do
            printf '%s | workspace entry %02d of %02d\n' \
              "$day" "$i" "$count" >> logs/activity.log
            git add logs/activity.log
            git commit -m "chore: workspace update ($i/$count)"
          done

          git push
